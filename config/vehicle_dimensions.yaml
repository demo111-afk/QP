# vehicle_dimensions.yaml
# 车辆/设施尺寸参考库，数据来自《车辆及设施尺寸参考表.xlsx》，单位：米。
#
# 结构（每个类别）：
#   id             对照原表的"序号"，方便回查源表
#   note           原表"状态或说明"列，原样保留
#   size_basis     原表"尺寸性质"列，翻译成三种取值：
#                    given_standard   给定标准尺寸（原表这样标注的类别）
#                    common_reference 常见参考值——原表脚注明确写了："只适合做尺寸异常
#                                     初筛，不应直接作为严格判错阈值"，后续接入 Rule
#                                     Engine 时要按这个区分对待，不能跟 given_standard
#                                     一样严格判定
#                    no_fixed_value   不设固定值（"其他车辆"/"组合车辆"这两类，原表
#                                     明确说明应以实际完整扫描尺寸为准，不编造数字）
#   reference_size 长/宽/高的参考尺寸；no_fixed_value 类别全部为 null
#   tolerance      允许偏差比例（不是固定 min/max！）：程序判断时用
#                    reference_size × (1 - tolerance) ~ reference_size × (1 + tolerance)
#                  动态算出允许范围，见 vehicle_dimension_config.check_dimension()。
#                  以后只改这里的 tolerance，判断范围自动更新，不需要改 reference_size，
#                  也不需要改代码。
#
# 有 2 种形态（比如"带箱体"/"不带箱体"）的原表类别，拆成两个类别名（用下划线区分），
# 因为同一个类别名不能对应两组不同的参考尺寸。
#
# 说明（原表脚注）：给定标准尺寸来自实测/既定标准；常见参考值只适合做尺寸异常初筛，
# 不应直接作为严格判错阈值；其他车辆及组合车辆应以实际完整扫描尺寸为准。

