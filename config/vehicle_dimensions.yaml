# vehicle_dimensions.yaml
# 车辆/设施尺寸参考库，单位：米。
# 优先数据源：Scene 25204（2026-08-03）和 Scene 29694（2026-08-06）的实际 bbox_data.csv，
# 未出现类别保留原参考表数据。
# 实测更新方法：先对同一 className + track_id 的所有帧取中位数，再对类别内各 Track
# 等权取中位数，避免长 Track 因帧数更多而支配结果。当前 2549 行、47 个 Label-Track，
# 每个 Track 的 scale_x/y/z 在观测帧内均保持不变。
#
# 结构（每个类别）：
#   id             对照原表的"序号"，方便回查源表
#   note           原表"状态或说明"列，原样保留
#   size_basis     原表"尺寸性质"列，翻译成三种取值：
#                    given_standard   给定标准尺寸（原表这样标注的类别）
#                    common_reference 常见参考值——原表脚注明确写了："只适合做尺寸异常
#                                     初筛，不应直接作为严格判错阈值"，后续接入 Rule
#                                     Engine 时要按这个区分对待，不能跟 given_standard
#                                     一样严格判定
#                    no_fixed_value   不设固定值（"其他车辆"/"组合车辆"这两类，原表
#                                     明确说明应以实际完整扫描尺寸为准，不编造数字）
#   reference_size 长/宽/高的参考尺寸；no_fixed_value 类别全部为 null
#   tolerance      允许偏差比例（不是固定 min/max！）：程序判断时用
#                    reference_size × (1 - tolerance) ~ reference_size × (1 + tolerance)
#                  动态算出允许范围，见 vehicle_dimension_config.check_dimension()。
#                  以后只改这里的 tolerance，判断范围自动更新，不需要改 reference_size，
#                  也不需要改代码。
#
# 2026-08-06 operational setting: all categories with a reference size use tolerance=0.50
# on every axis, meaning Reference Size ±50%. Categories without a fixed reference remain null.
#
# 同一平台 Label 存在多种真实尺寸时，用下划线拆成变体。Scene 25204 的托架按用户确认和
# 实测高度状态拆为高型/低型；平板车、自身拖挂车仍保留原表带箱体/不带箱体变体。
#
# 说明（原表脚注）：给定标准尺寸来自实测/既定标准；常见参考值只适合做尺寸异常初筛，
# 不应直接作为严格判错阈值；其他车辆及组合车辆应以实际完整扫描尺寸为准。

classes:
  雪糕筒:
    id: 1
    note: "Scene 25204 实测 5 Track；包含1个局部轴向不同的0.75m长度样本，Reference length校准为0.50m以适配±50%"
    size_basis: "given_standard"
    reference_size: {length: 0.50, width: 0.45, height: 0.75}
    tolerance: {length: 0.50, width: 0.50, height: 0.50}

  行人:
