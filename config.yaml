# =============================================================
# QP Copilot 配置文件
# 所有可调参数都集中在这里，不要把参数硬编码进 Python 代码。
# =============================================================

# -------------------------------------------------------------
# 场景信息（只用于命名截图 / 报告，不会自动填入网页）
# -------------------------------------------------------------
scene:
  # 场景 ID，留空则脚本运行时会让你手动输入
  scene_id: ""
  # 本次场景总帧数。运行时脚本会询问总帧数，直接回车就用这个默认值，
  # 输入具体数字则按输入的来，不需要在这里改。
  frame_count: 81
  # 起始帧号。QP 平台底部帧号栏通常从 1 开始显示（1~81），
  # 所以默认是 1；如果平台从 0 开始显示，改成 0。
  start_frame_index: 1
  # 当前页面的首帧资源通常在网络监听器启动前已经加载完，等待它只会超时。
  # true 时首帧不导航、不等待、不截图、不提取 BBox、不下载 Assets，也不记为缺失或空帧；
  # Scene 总帧数仍使用上面的 frame_count，实际质检从第二帧开始。
  skip_first_frame: true

# -------------------------------------------------------------
# 浏览器连接方式
#   mode: "cdp"    -> 连接你手动打开、已登录 QP 平台的 Chrome（推荐，最安全）
#   mode: "launch" -> 脚本自己启动一个新的浏览器窗口（需要你在新窗口里重新登录）
# -------------------------------------------------------------
browser:
  mode: "cdp"
  # 使用 cdp 模式时，Chrome 需要以调试端口启动，见 README「如何启动浏览器调试模式」
  cdp_url: "http://127.0.0.1:9222"
  # 使用 launch 模式时的设置
  launch:
    headless: false
    channel: "chrome"      # 使用系统安装的 Chrome，而不是 Playwright 自带的 Chromium
    slow_mo_ms: 0           # 每个操作后额外停顿的毫秒数，调试时可以调大方便观察

  # 如果一个 CDP 连接下有多个标签页，按标题关键字匹配当前 QP 页面
  # 留空则默认使用第一个打开的标签页
  page_title_hint: ""

# -------------------------------------------------------------
# 翻帧方式（navigator.py 使用）——唯一支持的模式：visible_text_bottom
#
# 背景：全局 text=数字 会误匹配页面其它地方"长得像帧号"的隐藏/非底部元素，比如
#   <span class="track-id">5</span>（标注对象 ID，不是帧号）。但 QP 平台底部帧号栏
#   确实是纯文本渲染的，不能完全放弃文本匹配，所以加两层过滤：
#     1. 文本精确匹配到目标帧号的元素里，只保留"可见"的
#     2. 再只保留 bounding_box 落在页面底部区域（y > viewport_height * bottom_region_ratio）的
#   多个候选时选最靠近底部的那个。一个候选都过滤不出来时（比如帧号栏做了虚拟滚动），
#   自动 fallback 到坐标点击（下面 timeline_start_x/timeline_y/frame_step_px），并记录 warning，
#   不会报错终止整个流程。
# -------------------------------------------------------------
navigation:
  mode: "visible_text_bottom"

  # 页面下 25% 区域（y > 75% 视口高度）才算"底部区域"，按实际帧号栏位置调整
  bottom_region_ratio: 0.75
  # 点击坐标在候选元素中心点基础上的偏移量（像素），一般不需要改
  click_offset_x: 0
  click_offset_y: 0
  # 帧号显示格式。例如页面显示 "01" "02" 而不是 "1" "2"，改成 "{n:02d}"
  frame_number_format: "{n}"

  # 可见文本+底部过滤找不到候选时的兜底方式，目前只支持 "coordinates"
  fallback_mode: "coordinates"
  # ---- fallback 坐标点击用：第 1 个帧号（start_frame_index）在页面上的像素坐标，
  #      以及每往后一帧横向间隔多少像素。量取方法见 README「如何配置坐标 fallback」。
  timeline_start_x: 200
  timeline_y: 780
  frame_step_px: 12

# -------------------------------------------------------------
# 截图设置
# -------------------------------------------------------------
screenshot:
  output_dir: "outputs/screenshots"
  format: "png"          # png 或 jpeg
  full_page: true         # 是否截取整页（包含滚动区域）
  jpeg_quality: 90         # 仅当 format = jpeg 时生效

# -------------------------------------------------------------
# 网络资源记录（network_recorder.py）
# 每帧应该加载 1 个 .pcd + 5 个 .jpg，这里用来验证脚本是否精准捕获到了这些请求，
# 也是 frame_ready.py 判断"这一帧是否加载完成"的数据来源。
# -------------------------------------------------------------
network:
  enabled: true
  # 输出的 CSV 文件名（保存在 report.output_dir 下）
  output_filename: "network_assets.csv"

  # 判断一个 response 是不是 PCD / JPG 请求的正则（大小写不敏感），
  # 如果平台的资源 URL 有特殊后缀或查询参数导致误判/漏判，在这里调整。
  pcd_url_pattern: "\\.pcd(\\?|$)"
  jpg_url_pattern: "\\.jpe?g(\\?|$)"

  # 资源怎么归属到具体某一帧：
  #   "timestamp"（默认，推荐）：从 URL 里提取共享的时间戳做分组，例如
  #     .../lidar/1782718264.299724.pcd 和 .../camera/CAM_XXX/1782718264.299724.jpg
  #     时间戳一致就认为是同一帧的数据。不依赖任何等待/清空的时机，
  #     即使平台提前预加载了下一帧的资源也不会丢。QP 实测过是这个 URL 结构。
  #   "window"：老式做法，只统计每帧开始（mark_frame_start）之后新增的资源。
  #     如果 timestamp_pattern 提取不出时间戳（说明平台 URL 结构不一样），退回这个模式。
  grouping_mode: "timestamp"
  # 从 URL 里提取时间戳分组 key 的正则，必须带一个捕获组。
  # 默认能匹配 "/lidar/1782718264.299724.pcd" 和 "/camera/CAM_FRONT_MID/1782718264.299724.jpg"
  # 这种"文件名本身就是时间戳.扩展名"的结构。如果平台的时间戳格式不一样，改这里。
  timestamp_pattern: "/(\\d+\\.\\d+)\\.(?:pcd|jpe?g)(?:\\?|$)"

  # 每帧期望捕获到的数量，用于判断 status 是否为 warning
  expected_pcd_count: 1
  expected_jpg_count: 5

# -------------------------------------------------------------
# 帧就绪检测（frame_ready.py）
# 切帧后不会直接截图，而是等这一帧真正"就绪"了才截图：
#   1. 抓到期望数量的 PCD/JPG
#   2. 网络连续 quiet_ms 毫秒没有新的 PCD/JPG 到达（避免"数量刚好够但其实还有资源在路上"）
#   3. 再额外等待 render_settle_ms，让 WebGL/Canvas/3D BBox 渲染稳定
# 超时不会中断程序，只会记录 warning，照样往下截图。
# -------------------------------------------------------------
frame_ready:
  wait_for_pcd: true
  expected_pcd_count: 1
  wait_for_jpg: true
  expected_jpg_count: 5
  timeout_seconds: 60   # 站点较卡，从 15 调大到 60，给资源更多加载时间
  quiet_ms: 800
  render_settle_ms: 3000   # 从 500 调大到 3000：PCD/JPG 网络确认加载完成后，3D BBox 渲染
                            # 经常还要再等一会儿才跟上（实测过有些帧滞后 1~3 帧的时间），
                            # 调大这个值让 BBox 提取前有更多缓冲。这是固定延迟，不保证
                            # 100% 覆盖所有滞后情况，用户已确认接受部分帧仍可能有问题。
  poll_interval_ms: 50

# -------------------------------------------------------------
# BBox 只读探测（bbox_probe.py）
# 只读取页面已有的 JS 全局变量/Three.js 场景，不修改任何平台数据。
# 探测本身的任何异常都不会影响主流程（截图和网络记录照常进行）。
# -------------------------------------------------------------
bbox_probe:
  enabled: true
  # first_frame_only : 只在第一个成功抓取的帧探测一次（注意不是"循环第 0 次"——
  #                     如果第 1 帧翻页/截图失败，会顺延到下一个成功的帧再探测）
  # every_frame       : 每一帧都探测（默认，会比只探测一帧慢，但能看到 BBox 是否随帧变化）
  # disabled          : 完全不探测
  mode: "every_frame"
  output_filename: "bbox_probe_report.json"

  # 在 window 全局对象的 key 名里做子串匹配（大小写不敏感）的关键词列表
  keywords:
    - viewer
    - scene
    - store
    - annotation
    - annotations
    - boxes
    - bbox
    - cube
    - cubes
    - object
    - objects
    - track
    - tracks
    - label
    - psr
    - position
    - rotation
    - scale

  # 命中关键词后，往对象内部再深挖几层去找嵌套字段（层数越多越慢，也越可能报错/超时）
  max_depth: 2

# -------------------------------------------------------------
# BBox 干净提取（bbox_extractor.py）
# 跟上面的 bbox_probe 是两回事：bbox_probe 是广撒网探测"数据大概在哪"，
# 这个是已经确认了确切位置（window.viewer.recycleVolumes[i].position/rotation/scale）
# 之后做的针对性提取，每帧产出结构化的 BBox 数值，写入 bbox_data.csv，供 rule_engine.py 使用。
# 只读属性，不调用任何函数，不修改任何数据。
# 已知限制：trackId / className（类别标签）目前经常读到 null，几何数据（位置/朝向/尺寸）
# 是确认过的真实数值；类别标签的关联方式还没找到，先原样留空。
# -------------------------------------------------------------
bbox_extract:
  enabled: true
  output_filename: "bbox_data.csv"

# -------------------------------------------------------------
# 质检规则引擎（rule_engine.py）
# 在全部帧采集完成、bbox_data.csv 写好之后才会运行（不是边采集边判断）。
# 新增规则只需要在 rule_engine.py 里写函数、注册到 RULE_REGISTRY，再把名字加到
# enabled_rules 里启用，不需要改这个文件之外的任何模块。
# 可以用 `python rule_engine.py` 单独对着已有的 bbox_data.csv 重新跑规则，
# 不需要重新打开浏览器、重新采集。
# -------------------------------------------------------------
rule_engine:
  output_filename: "rule_report.csv"

  # 当前启用的规则，按需要增删（规则实现见 rule_engine.py 里同名函数）
  enabled_rules:
    - LabelConsistency        # 同一目标跨帧类别不能变
    - PositionJump             # 同一目标跨帧位置跳变超过阈值
    - RotationJump               # 同一目标跨帧 rotation_z 跳变超过阈值
    - SizeConsistency              # 同一目标跨帧尺寸变化比例超过阈值
    - BrokenTrack                    # 同一目标连续消失 <= N 帧后又出现（默认 Info，满足条件才升级 Warning）
    - EmptyFrame                         # 某帧一个框都没有
    - SizeOutlier                          # 框的任一尺寸小于/大于合理范围
    - DimensionMismatch                        # 错标：BBox 尺寸跟 vehicle_dimensions.yaml 参考尺寸差太多（Phase 2）
    - PossibleMissingAnnotation                  # 漏标：PCD 里存在未被任何 BBox 覆盖的可疑点云聚类（Phase 2）

  # ---- 以下是各规则的参数，全部集中在这里，不要硬编码进代码 ----
  position_jump_threshold: 25.0     # 米，PositionJump 用（原来 10m 太容易误报，改成 25m）
  rotation_jump_threshold: 1.0       # 弧度，RotationJump 用（已处理角度环绕）
  size_change_threshold: 0.3          # 比例（0.3 = 30%），SizeConsistency 用
  broken_track_gap: 3                    # 帧，BrokenTrack 用（消失超过这个数就不算 broken，算正常离场）
  size_outlier_min: 0.1                    # 米，SizeOutlier 下限
  size_outlier_max: 30.0                     # 米，SizeOutlier 上限
  # ---- 以下是 Phase 2 新增两条规则的参数 ----

  # DimensionMismatch（错标）：只用 config/vehicle_dimensions.yaml 里的 Reference Size +
  # Tolerance 做判断，不调用 Vision/Intensity，不做车辆分类。
  # scale_x/y/z -> length/width/height 的映射已经用真实数据核对过（见灯塔 scale_z ≈ 8.0m 高度、
  # 轿车 scale_x>scale_y>scale_z 符合 length>width>height），直接在 rule_engine.py 里写死，
  # 不做成配置项。
  mislabel:
    multi_variant_strategy: any_variant   # 托架/平板车/自身拖挂车这类有"带箱体/不带箱体"两种
                                            # 参考尺寸的类别："any_variant" = 落在任一变体的
                                            # 容差范围内就算合格（平台 className 不区分这两种状态）

  # PossibleMissingAnnotation（漏标）：只发现"未被已有 BBox 覆盖的点云区域"，不判断类别，
  # 不调用 Vision/LLM。读取 assets_downloader.py 已下载的 PCD（assets/scene_id/frame_NNNN/
  # pointcloud.pcd），跟 sample_interval 一样，只能覆盖有下载 PCD 的帧。
  #
  # 真实数据实测过（scene 25255，单帧 31 万点）：跳过 voxel_size/height_threshold 这两步
  # 预处理、直接对全场景残留点跑 DBSCAN 会内存溢出——一半以上的点是地面，密度极高。
  # 这两步不是完整的 Ground Removal（没有 RANSAC/平面拟合/CSF/Patchwork++），只是固定
  # 参数的点云预处理，目的仅仅是把 DBSCAN 的输入规模降到能跑得动。下面几个值都是按
  # 这次真实数据调出来的初始值，跟着实际效果继续调。
  cluster_detector:
    ego_exclusion_box:                # 车体/传感器安装区域，删除每帧重复出现的固定近场回波。
      enabled: true                   # 使用车体坐标轴范围，不使用整圈最小距离，避免误删近车真实目标。
      min_x: -2.0
      max_x: 2.8
      min_y: -1.2
      max_y: 1.2
      min_z: -1.0
      max_z: 2.5
    max_detection_range: 100.0        # 米，只对 LiDAR 周围 100m 水平半径内的残余点做漏标聚类；
                                        # 只影响 Cluster Detector，不影响 BBox 收集、Rule Report 或切帧。
    voxel_size: 0.2                  # 米，Voxel Downsample 网格大小。实测 31万点 -> 降到约5万点
    height_threshold: 0.3             # 米，Simple Height Filter 下限：只保留 z > 这个值的点（这一
                                        # 帧里 54% 的点挤在 z∈[-0.38,0.22) 这个地面薄层，0.3 能把
                                        # 这一层滤掉，是这一帧点云自己坐标系里的绝对高度，不是
                                        # 拟合出来的地面）
    max_height: null                    # 不再聚类前用固定绝对高度删除所有高点；高结构由合并后的
                                          # 物理范围和体积约束处理。固定 z<10 曾删除真实竖直结构顶部。
    clustering_method: "hdbscan"        # 0-100m 点密度差异显著，生产流程使用变密度层次聚类。
    hdbscan_min_cluster_size: 12        # 最小叶簇点数；Frame 81 BBox 遮蔽回放对 18/18 已标目标有响应。
    hdbscan_min_samples: 4              # 核心密度稳健度；与 min_cluster_size 分开配置。
    hdbscan_cluster_selection_method: "leaf"  # 保留局部叶簇，再由受控 Fragment Merge 组合。
    eps: 0.4                           # DBSCAN 兼容模式参数；仅 clustering_method=dbscan 时使用。
    min_points: 5                      # DBSCAN 兼容模式参数；HDBSCAN 不读取此项。
    bbox_margin: 0.05                    # BBox 内部点判定的裕量比例，避免框边缘的真实点被误判成残留点
    min_cluster_point_count: 15          # 遮蔽回放中 15 点仍保持 17/18 召回；20 点会降到 14/18。
    min_cluster_volume: 0.001            # 仅删除数值上几乎退化为零体积的结果。
    max_cluster_volume: 200.0            # 合并后物理体积兜底，不承担类别判断。
    min_vertical_extent: 0.3             # 删除只剩地面薄层的组；遮蔽回放未降低 17/18 召回。
    max_horizontal_aspect_ratio: 20.0    # 删除护栏/边线一类极端水平细长结构；不影响垂直灯塔。
    low_height_threshold: 1.0            # 低于此高度时启用水平占地面积门禁。
    max_low_height_horizontal_area: 12.0 # 删除成排设施或地面结构被合成的大面积低矮候选。
    max_candidate_base_height: 15.0      # 允许结构顶部超过 15m，但整个 Cluster 的最低点若仍在
                                          # 15m 以上则视为高空背景；避免恢复固定 z<10 截顶。
    min_flatness: 0.0                    # PCA 形状保留为 Evidence，不再一票否决线状有效目标。
    min_pca_thickness_ratio: 0.0          # Thickness 保留为 Evidence，不再一票否决单面可见目标。
    min_cluster_confidence: 0.0           # 不按 HDBSCAN 概率硬删；低概率候选降为 Suspicious。
    high_confidence_threshold: 0.8        # HDBSCAN 平均 membership probability 达到此值时标为 Possible。
    spatial_dedup_distance: 1.0                  # 米，不同采样帧候选中心在此距离内时，报告视为同一
                                                    # 固定 Cluster，合并为一条并记录 first/last frame、
                                                    # occurrence_count 和 observed_frames。只影响报告去重，
                                                    # 不影响逐帧 Cluster 和 Projection。
    merge_distance: 0.3                  # HDBSCAN 叶簇的 XY AABB Gap；真实回放保持 17/18 召回，
                                          # 同时避免 0.8m 合并造成真实叶簇进入大型链式组。
    merge_max_z_gap: 1.0                 # 普通碎片还需 Z 间隔不超过 1m；XY footprint 真重叠时例外。
    vertical_merge_min_xy_overlap: 0.05  # 上下断裂结构需在 X/Y 两轴都至少重叠 5cm 才跨高度合并。
    weak_fragment_overlap_only: false    # 不再因一个弱桥整组删除；由受控 Z/XY 合并边和物理上限兜底。
    preserve_fragments_on_merge_reject: false # 保留诊断开关但生产关闭；释放大型组全部叶簇会让
                                               # Frame 81 膨胀到 287 个候选和 280 个 ROI。
    weak_fragment_min_xy_overlap: 0.05           # 米，弱碎片与其他碎片的 X/Y footprint 两个方向都至少
                                                    # 重叠这个距离时，该连接才不会触发整组合并拒绝。
    max_merged_extent: 30.0                      # 米，合并后 AABB 最长边的上限，超过就整条丢弃——第二次
                                                    # 聚类的合并判据具备链式传递性（A-B、B-C 各自在
                                                    # merge_distance 内会连成一组，即使 A-C 相距较远），
                                                    # 这个阈值是链式合并出不合理结果时的兜底检查。30m 足够
                                                    # 覆盖岸桥（25m 长）这种最大的合法目标。

# -------------------------------------------------------------
# Cluster Projection：仅处理命中 assets.sample_interval、且 PCD/JPG/BBox 均成功的帧。
# Calibration YAML 由 UI 在本次运行时传入，不写进 config.yaml。
# 原始 JPG 保留在 images/，画框后的 JPG 保存到每帧独立的新子目录。
# -------------------------------------------------------------
projection:
  enabled: true
  output_dirname: "projection_debug"
  min_depth: 0.1
  min_visible_points: 3
  padding_px: 8
  line_width: 1                      # Projection Debug JPG 矩形描边像素；不改变 ROI 几何范围。
  wrong_annotation:
    enabled: true                    # Existing BBox 与漏标 Cluster 使用同一批采样帧和相机。
    edge_samples: 9                  # 每条 BBox 边的三维采样点数；投影数学仍复用 project_points。
    min_visible_points: 3
    padding_px: 8

# -------------------------------------------------------------
# 报告设置（report.py）
# capture_report.csv 汇总实际质检帧的切帧状态、就绪状态、PCD/JPG 数量和截图路径。
# -------------------------------------------------------------
report:
  output_dir: "outputs/reports"
  capture_report_filename: "capture_report.csv"

# -------------------------------------------------------------
# Assets（PCD + JPG 文件本体）下载（assets_downloader.py）
# 跟 BBox 无关：BBox 的采集/保存逻辑保持现状，不受这里任何配置影响。
# 复用 network_recorder.py 已经监听/分组好的 URL，不新增浏览器监听。
# -------------------------------------------------------------
assets:
  enabled: true
  # 保存目录，跟 outputs/ 完全独立，不放进 reports 也不放进 bbox 数据里
  output_dir: "assets"
  # 每隔多少帧下载一次 PCD/JPG 文件本体，只影响 Assets 下载数量，
  # 不影响 BBox 采集 / Rule Engine / Report（它们仍处理全部实际质检帧，即默认 Frame 2 起）。
  # 默认跳过首帧后，81 帧、sample_interval=10 时下载第 2/12/22/.../72 帧的 Assets。
  # 改成 1 表示每一帧都下载。
  sample_interval: 10
  download_pcd: true
  download_jpg: true
  request_timeout_ms: 30000

# -------------------------------------------------------------
# 判断分析模块（第一版为空，预留给后续的规则引擎 / AI 视觉模型）
# 抓取（浏览+截图）和判断分析是两个独立阶段：
#   main.py     只做抓取，产出截图 + capture_report.csv
#   analyze.py  读 capture_report.csv 做判断分析，不需要打开浏览器
# 新增分析器后，把名字加入下面的 enabled_analyzers 列表即可启用，
# 具体注册方式见 analyzers.py 顶部注释。
# -------------------------------------------------------------
analysis:
  enabled_analyzers: []   # 例如以后填 ["rules", "ai_vision"]

# -------------------------------------------------------------
# 单 Cluster Vision 输入：只消费现有 Cluster Projection，不修改原始 JPG。
# 测试限制在图片生成前应用，避免为未选中的候选复制整张 context 图片。
# -------------------------------------------------------------
ai_inputs:
  enabled: true
  output_dir: "ai_inputs"
  crop_expand_ratio: 0.50            # ROI 四周各扩展自身宽/高的 50%，并裁到图片边界。
  crop_expand_ratio_by_candidate:
    residual_cluster: 0.20           # 漏标候选减少邻近目标混入；context 图仍保留完整场景。
    existing_bbox: 0.25              # 错标 crop 减少邻近车辆/设施混入；context 仍保留完整场景。
  jpeg_quality: 92
  context_line_width: 2
  quality:
    min_roi_area_px: 400
    min_roi_width_px: 48
    min_roi_height_px: 32
    max_roi_area_ratio: 0.50
    min_visible_points: 8
    edge_margin_px: 2
    max_border_touch_sides: 1
  quality_by_candidate:
    existing_bbox:
      min_roi_area_px: 2500
      min_roi_width_px: 64
      min_roi_height_px: 48
      max_roi_area_ratio: 0.65
      min_visible_points: 12
      edge_margin_px: 2
      max_border_touch_sides: 2

# -------------------------------------------------------------
# Qwen-VL：V1.0 默认启用；API Key 从项目根目录 .env 或同名环境变量读取。
# API Key 只读取 api_key_env 指定的环境变量，绝不写入 YAML 或仓库。
# api_base 具有地域/Workspace 差异，启用前必须填写实际兼容模式地址。
# vision_test_limit=0 表示正式运行审核全部可用 Cluster；测试时可临时设置上限。
# -------------------------------------------------------------
ai_vision:
  enabled: true
  provider: "qwen"
  model_name: "qwen3-vl-plus"
  category_whitelist_path: "config/vision_categories.yaml"  # 来自车辆及设施尺寸参考表.xlsx
  api_base: "https://ws-vcvh6mb9582en9ic.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  api_key_env: "DASHSCOPE_API_KEY"
  timeout: 60
  max_retries: 2
  retry_delay_seconds: 1.0
  use_environment_proxy: false       # 避免继承终端里的 socks:// 浏览器代理；需要时可显式改 true。
  vision_workers: 2                  # 独立 Candidate 两路并发；报告仍按原任务顺序汇总。
  cache:
    enabled: true                    # 相同模型/Prompt/Metadata/图片重跑时不重复调用 API。
    dirname: ".vision_cache"         # 位于 ai_inputs/scene_<id>/ 下，Cleanup 会随 Scene 删除。
    schema_version: "vision-cache-v1"
  vision_test_limit: 0
  uncertain_confidence_threshold: 0.60
  missing_annotation:
    confidence_threshold: 0.92       # Qwen 自报置信度未校准；0.95 在真实回放中造成断崖式漏检。
    temporal_dedup:
      enabled: true                  # Vision 前去重；不改变 Cluster 检测和 Projection 结果。
      registration:
        min_common_tracks: 6         # 用同 Track ID 的已有 BBox 估计采样帧间自车运动。
        min_inliers: 4
        min_inlier_ratio: 0.50       # RANSAC 排除真实运动目标及异常 Track。
        inlier_threshold_m: 0.50
        max_hypotheses: 5000
      matching:
        min_observations: 3          # 至少 3 个采样帧稳定出现才减少 API；允许中间帧未成簇。
        max_center_step_m: 0.30      # 坐标已补偿自车运动；不直接比较原始 LiDAR 坐标。
        max_center_diameter_m: 0.50  # 限制整组范围，防止链式合并附近不同物体。
        max_z_delta_m: 0.50
        max_size_ratio: 3.00
        max_pca_distance: 0.50
    category_size_gate:
      enabled: true
      min_axis_ratio: 0.10           # Residual 点云可能不完整；低于参考尺寸 10% 才按局部碎片排除。
      max_axis_ratio: 2.00           # Cluster 任一轴不得超过表格参考尺寸的 2.0 倍。
  wrong_annotation:
    enabled: true
    vision_test_limit: 0             # 0=检查全部 Track；同一 track_id 只选择投影质量最佳的一帧。
    confidence_threshold: 0.90       # Qwen 自报置信度只作为必要条件，不单独决定报告准入。
    aggregation_mode: "per_frame"   # 对每个 Track 选中的单个代表帧独立判断。
    min_consistent_observations: 2   # 仅 aggregation_mode=track_consensus 时使用。
    min_consensus_ratio: 0.67        # 仅 track_consensus 时使用；错误票需达到 67%。
    label_aliases:
      托架: "卡车拖架"
      平台车1: "平台车"
      皮带车: "行李传送带车"
      车辆: "其他车辆"
      其他车: "其他车辆"
      飞机拖车A: "飞机拖车甲型"
      飞机拖车B: "飞机拖车乙型"
